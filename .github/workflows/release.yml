name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.platform }} ${{ matrix.args }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    env:
      # Tag refs are controlled by repo collaborators (push permission required)
      # but we still pass them through env vars to keep workflow expressions
      # off of any shell evaluation path.
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal Rust targets
        if: matrix.platform == 'macos-latest'
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'Druhý názor ${{ env.RELEASE_TAG }}'
          releaseBody: |
            See [CHANGELOG](https://github.com/lukoplt/druhy-nazor/blob/main/CHANGELOG.md) for details.

            **Downloads:**
            - macOS: `.dmg` (universal, Apple Silicon + Intel)
            - Windows: `.msi` (x64)
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
