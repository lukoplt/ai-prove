<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- glass squircle gradient: indigo -> violet -->
    <linearGradient id="bg" x1="160" y1="120" x2="864" y2="904" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#3b2bb8"/>
    </linearGradient>
    <!-- top sheen -->
    <linearGradient id="sheen" x1="512" y1="120" x2="512" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bubble" x1="300" y1="290" x2="724" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef0f8"/>
    </linearGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#1e1b4b" flood-opacity="0.32"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- squircle base -->
  <g filter="url(#ds)">
    <path d="M512 84
      C 760 84, 884 84, 940 140
      C 996 196, 996 320, 996 512
      C 996 704, 996 828, 940 884
      C 884 940, 760 940, 512 940
      C 264 940, 140 940, 84 884
      C 28 828, 28 704, 28 512
      C 28 320, 28 196, 84 140
      C 140 84, 264 84, 512 84 Z"
      fill="url(#bg)"/>
  </g>
  <path d="M512 84
    C 760 84, 884 84, 940 140
    C 996 196, 996 320, 996 512
    C 996 704, 996 828, 940 884
    C 884 940, 760 940, 512 940
    C 264 940, 140 940, 84 884
    C 28 828, 28 704, 28 512
    C 28 320, 28 196, 84 140
    C 140 84, 264 84, 512 84 Z"
    fill="url(#glow)"/>
  <!-- top sheen clipped to squircle -->
  <clipPath id="sq">
    <path d="M512 84 C 760 84, 884 84, 940 140 C 996 196, 996 320, 996 512 C 996 704, 996 828, 940 884 C 884 940, 760 940, 512 940 C 264 940, 140 940, 84 884 C 28 828, 28 704, 28 512 C 28 320, 28 196, 84 140 C 140 84, 264 84, 512 84 Z"/>
  </clipPath>
  <g clip-path="url(#sq)">
    <ellipse cx="512" cy="120" rx="560" ry="360" fill="url(#sheen)"/>
  </g>

  <!-- back bubble (second opinion) -->
  <g filter="url(#soft)" opacity="0.9">
    <path d="M392 250
      h300 a86 86 0 0 1 86 86
      v150 a86 86 0 0 1 -86 86
      h-150 l-96 78 v-78
      h-54 a86 86 0 0 1 -86 -86
      v-150 a86 86 0 0 1 86 -86 Z"
      fill="#a5b4fc" opacity="0.55"/>
  </g>

  <!-- front bubble with checkmark -->
  <g filter="url(#soft)">
    <path d="M318 360
      h388 a92 92 0 0 1 92 92
      v176 a92 92 0 0 1 -92 92
      h-232 l-128 104 v-104
      h-28 a92 92 0 0 1 -92 -92
      v-176 a92 92 0 0 1 92 -92 Z"
      fill="url(#bubble)"/>
  </g>

  <!-- checkmark -->
  <path d="M388 540 l84 86 l160 -176"
    fill="none" stroke="#4f46e5" stroke-width="58"
    stroke-linecap="round" stroke-linejoin="round"/>
</svg>
